name: 웹 언급 분기 수집

on:
  schedule:
    - cron: '0 18 10 * *'   # 매월 11일 03:00(KST). 직전 분기가 없으면 수집, 있으면 점검 날짜만 기록(60일 무활동 시 예약 실행이 꺼지는 것 방지)
  workflow_dispatch:
    inputs:
      quarter:
        description: '수집할 분기(예: 2026Q3). 비우면 직전 분기'
        required: false

permissions:
  contents: write

concurrency:
  group: web-mentions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install -r scripts/web_mentions/requirements.txt
      - name: 수집
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          QUARTER: ${{ github.event.inputs.quarter }}
        run: |
          if [ -n "$QUARTER" ]; then python scripts/web_mentions/collect_web_mentions.py --quarter "$QUARTER"
          else python scripts/web_mentions/collect_web_mentions.py --if-missing; fi
      - name: 결과 커밋(변경이 있을 때만)
        run: |
          git config user.name "web-mentions-bot"
          git config user.email "web-mentions-bot@users.noreply.github.com"
          git add data/grades/web_mentions.json data/grades/web_mentions_history.json data/grades/web_mentions_status.json data/release-manifest.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "Web mentions: quarterly collection or monthly check"
          git pull --rebase origin main
          git push
